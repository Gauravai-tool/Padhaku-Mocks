<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SSC CGL Premium Mock - Padhaku Mock</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --primary: #1A73E8; --accent: #F0A93B; --glass: rgba(255, 255, 255, 0.9); --answered: #2E7D32; --marked: #7B1FA2; }
        body { font-family: 'Roboto', sans-serif; margin: 0; padding: 0; background: #f0f2f5 url('https://www.transparenttextures.com/patterns/cubes.png') fixed; color: #202124; height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; }
        .app-bar { background: var(--primary); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 100; }
        .timer-chip { background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 16px; }
        .lang-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-right: 12px; cursor: pointer; }
        .tabs { background: white; display: flex; overflow-x: auto; padding: 8px; gap: 6px; border-bottom: 1px solid #eee; }
        .tab { padding: 6px 16px; background: #f1f3f4; border-radius: 20px; font-size: 11px; white-space: nowrap; color: #5f6368; font-weight: 500; }
        .tab.active { background: var(--primary); color: white; }
        .content { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
        .glass-card { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; padding: 24px; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08); border: 1px solid rgba(255, 255, 255, 0.6); margin-bottom: 20px; }
        .q-text { font-size: 17px; line-height: 1.6; margin-bottom: 24px; font-weight: 500; }
        .q-text img { max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; }
        .option-row { background: rgba(255,255,255,0.65); border: 1px solid rgba(0,0,0,0.08); padding: 16px; border-radius: 14px; display: flex; align-items: center; font-size: 15px; margin-bottom: 12px; cursor: pointer; }
        .option-row.selected { background: rgba(26, 115, 232, 0.1); border-color: var(--primary); }
        .bullet { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #ccc; margin-right: 14px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
        .selected .bullet { background: var(--primary); color: white; border-color: var(--primary); }
        .footer { background: white; padding: 12px 16px; display: flex; gap: 12px; border-top: 1px solid #eee; }
        .btn { flex: 1; height: 50px; border-radius: 12px; border: none; font-weight: 700; font-size: 13px; text-transform: uppercase; }
        .btn-outline { background: #f1f3f4; color: #3c4043; }
        .btn-primary { background: var(--primary); color: white; }
        .fab { position: absolute; right: 20px; bottom: 95px; width: 56px; height: 56px; background: var(--accent); border-radius: 28px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,0.2); z-index: 50; }
        .palette-drawer { position: fixed; top: 0; right: -100%; width: 85%; height: 100%; background: white; z-index: 1000; transition: 0.4s; padding: 24px; box-sizing: border-box; overflow-y: auto; }
        .palette-drawer.open { right: 0; }
        .palette-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; display: none; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 20px; }
        .grid-item { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: #f1f3f4; }
        .grid-item.answered { background: var(--answered); color: white; }
        .grid-item.marked { background: var(--marked); color: white; }
        .grid-item.current { outline: 3px solid var(--primary); }
        .solution-box { margin-top: 24px; padding: 20px; border-radius: 16px; background: #f8fdf9; border: 1.5px solid #e0f2f1; display: none; font-size: 14px; color: #2e7d32; }
        .result-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; text-align: center; padding-top: 60px; }
    </style>
</head>
<body>
    <div class="app-bar">
        <div style="display:flex; align-items:center">
            <button class="lang-btn" onclick="toggleLang()" id="lang-text">HINDI</button>
            <h1>SSC CGL PREMIUM</h1>
        </div>
        <div class="timer-chip" id="timer">60:00</div>
    </div>
    <div class="tabs">
        <div class="tab" id="tab-6" onclick="jumpToSection('6')">Reasoning</div>
        <div class="tab" id="tab-18" onclick="jumpToSection('18')">GK</div>
        <div class="tab" id="tab-17" onclick="jumpToSection('17')">Maths</div>
        <div class="tab" id="tab-7" onclick="jumpToSection('7')">English</div>
    </div>
    <div class="content">
        <div class="glass-card">
            <div id="q-counter" style="font-size:12px; color:#777; margin-bottom:10px; font-weight:700"></div>
            <div class="q-text" id="q-display"></div>
            <div class="options-group" id="options-display"></div>
            <div class="solution-box" id="solution-display"><strong>Solution:</strong> <div id="sol-content"></div></div>
        </div>
    </div>
    <div class="fab" onclick="togglePalette()">P</div>
    <div class="footer">
        <button class="btn btn-outline" onclick="prev()">Previous</button>
        <button class="btn btn-outline" style="background:#FFF3E0; color:#E65100" onclick="mark()">Mark</button>
        <button class="btn btn-primary" onclick="next()">Save & Next</button>
    </div>
    <div class="palette-overlay" id="p-overlay" onclick="togglePalette()"></div>
    <div class="palette-drawer" id="p-drawer">
        <h3>Palette</h3>
        <div class="grid" id="p-grid"></div>
        <button class="btn btn-primary" style="width:100%; margin-top:30px" onclick="submitTest()">Submit Test</button>
    </div>
    <div class="result-view" id="result-screen">
        <h2>Result</h2>
        <div style="font-size:48px; font-weight:900; color:var(--primary)" id="final-score">0</div>
        <div id="stats-text" style="margin-top:20px"></div>
        <button class="btn btn-primary" style="margin-top:40px; width:200px" onclick="reviewMode()">Review</button>
    </div>

</body>
</html>
